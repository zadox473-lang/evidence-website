<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Evidence.gg | Scammer Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 50%, #0a0a1a 100%);
            min-height: 100vh;
            color: #fff;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }
            100% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.3); }
        }

        .header {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
        }

        .logo .blue {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #00ffff;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .stat-card:hover {
            border-color: #00ffff;
            animation: glow 1s ease-in-out;
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #00ffff;
        }

        .stat-label {
            font-size: 11px;
            color: #8892b0;
            margin-top: 5px;
        }

        .search-container {
            margin: 25px 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: rgba(15, 25, 45, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50px;
            padding: 5px 5px 5px 18px;
        }

        .search-box:focus-within {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-box input::placeholder {
            color: #4a5568;
        }

        .search-box button {
            background: linear-gradient(135deg, #00ffff, #0066ff);
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            display: inline-block;
        }

        .scammers-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 15px 0;
        }

        .scammer-card {
            background: rgba(15, 25, 45, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 14px;
            padding: 15px;
        }

        .scammer-card:hover {
            border-color: #00ffff;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .scammer-username {
            font-size: 16px;
            font-weight: 700;
            color: #ff4444;
        }

        .scammer-id {
            font-size: 12px;
            color: #8892b0;
        }

        .amount {
            font-size: 18px;
            font-weight: 800;
            color: #00ff88;
        }

        .summary {
            color: #a0aec0;
            font-size: 13px;
            line-height: 1.4;
            margin: 10px 0;
        }

        .card-buttons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .btn {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffff, #0066ff);
            color: #fff;
            border: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .pagination button {
            background: rgba(15, 25, 45, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .pagination button.active {
            background: linear-gradient(135deg, #00ffff, #0066ff);
            border-color: transparent;
        }

        .footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            margin-top: 30px;
            font-size: 12px;
            color: #4a5568;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00ffff;
        }

        .admin-link {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 255, 255, 0.15);
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 11px;
            text-decoration: none;
            color: #00ffff;
            z-index: 100;
        }

        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
            .stat-value {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="container">
            <div class="logo">
                <span class="blue">🔷 EVIDENCE.GG 🔷</span>
            </div>
            <div class="subtitle">SCAMMER DATABASE</div>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid" id="statsContainer">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalReports">0</div>
                <div class="stat-label">TOTAL REPORTS</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚨</div>
                <div class="stat-value" id="totalScammers">0</div>
                <div class="stat-label">TOTAL SCAMMERS</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="totalAmount">$0</div>
                <div class="stat-label">TOTAL AMOUNT</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👑</div>
                <div class="stat-value" id="topScammer">-</div>
                <div class="stat-label">TOP SCAMMER</div>
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search by username or ID...">
                <button id="searchBtn">SEARCH</button>
            </div>
        </div>

        <div class="section-title">📋 RECENT SCAM REPORTS</div>
        <div id="scammersList" class="scammers-grid">
            <div class="loading">Loading data...</div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <div class="footer">
        🔷 Evidence.gg | Protecting the Telegram community 🔷
    </div>

    <a href="login.html" class="admin-link">👑 Admin Portal</a>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkMVWQ4NCqV7yJIUwBwu2NImetw7zUJeY",
            authDomain: "scammer-database.firebaseapp.com",
            projectId: "scammer-database",
            storageBucket: "scammer-database.firebasestorage.app",
            messagingSenderId: "257014278130",
            appId: "1:257014278130:web:1c527b320f36b4d6c5ed6b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allReports = [];
        let currentPage = 1;
        const reportsPerPage = 10;

        async function loadReports() {
            try {
                document.getElementById('scammersList').innerHTML = '<div class="loading">📡 Fetching data...</div>';
                
                const snapshot = await db.collection('reports')
                    .where('status', '==', 'approved')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                allReports = [];
                snapshot.forEach(doc => {
                    allReports.push({ id: doc.id, ...doc.data() });
                });
                
                updateStatistics();
                displayReports();
            } catch (error) {
                document.getElementById('scammersList').innerHTML = '<div class="loading">⚠️ Error loading data.</div>';
            }
        }

        function updateStatistics() {
            const totalReports = allReports.length;
            
            const uniqueScammers = new Set();
            allReports.forEach(r => {
                if (r.user_id) uniqueScammers.add(r.user_id);
                if (r.username) uniqueScammers.add(r.username);
            });
            
            let totalAmountNum = 0;
            allReports.forEach(r => {
                let amountStr = r.amount || "$0";
                let num = parseFloat(amountStr.replace(/[^0-9.-]/g, ''));
                if (!isNaN(num)) totalAmountNum += num;
            });
            
            let topScammer = "-";
            let topAmount = 0;
            const scammerMap = new Map();
            allReports.forEach(r => {
                const name = r.username || `ID: ${r.user_id}`;
                let amountNum = parseFloat((r.amount || "$0").replace(/[^0-9.-]/g, ''));
                if (isNaN(amountNum)) amountNum = 0;
                const existing = scammerMap.get(name) || 0;
                scammerMap.set(name, existing + amountNum);
            });
            for (let [name, amount] of scammerMap) {
                if (amount > topAmount) {
                    topAmount = amount;
                    topScammer = name.length > 12 ? name.substring(0, 10) + '..' : name;
                }
            }
            
            document.getElementById('totalReports').innerText = totalReports;
            document.getElementById('totalScammers').innerText = uniqueScammers.size;
            document.getElementById('totalAmount').innerText = `$${totalAmountNum.toLocaleString()}`;
            document.getElementById('topScammer').innerHTML = topScammer;
        }

        function displayReports() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allReports;
            
            if (searchTerm) {
                filtered = allReports.filter(r => 
                    (r.username && r.username.toLowerCase().includes(searchTerm)) ||
                    (r.user_id && r.user_id.toString().includes(searchTerm))
                );
            }
            
            const totalPages = Math.ceil(filtered.length / reportsPerPage);
            const start = (currentPage - 1) * reportsPerPage;
            const paginatedReports = filtered.slice(start, start + reportsPerPage);
            
            const container = document.getElementById('scammersList');
            
            if (paginatedReports.length === 0) {
                container.innerHTML = '<div class="loading">🔍 No reports found</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            container.innerHTML = paginatedReports.map(report => `
                <div class="scammer-card">
                    <div class="card-header">
                        <div>
                            <span class="scammer-username">${escapeHtml(report.username || 'N/A')}</span>
                            <div class="scammer-id">ID: ${escapeHtml(report.user_id || 'N/A')}</div>
                        </div>
                        <div class="amount">${escapeHtml(report.amount || '$0')}</div>
                    </div>
                    <div class="summary">${escapeHtml(report.summary ? report.summary.substring(0, 120) + (report.summary.length > 120 ? '...' : '') : 'No description.')}</div>
                    <div class="card-buttons">
                        <a href="report.html?id=${report.id}" class="btn btn-primary">📄 VIEW REPORT</a>
                        ${report.proof_channel ? `<a href="${report.proof_channel}" target="_blank" class="btn btn-outline">🔍 VIEW PROOF</a>` : ''}
                    </div>
                </div>
            `).join('');
            
            let paginationHtml = '';
            if (currentPage > 1) {
                paginationHtml += `<button onclick="changePage(${currentPage - 1})">◀ PREV</button>`;
            }
            
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += `<button onclick="changePage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            
            if (currentPage < totalPages) {
                paginationHtml += `<button onclick="changePage(${currentPage + 1})">NEXT ▶</button>`;
            }
            document.getElementById('pagination').innerHTML = paginationHtml;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function changePage(page) {
            currentPage = page;
            displayReports();
        }

        document.getElementById('searchBtn').addEventListener('click', () => {
            currentPage = 1;
            displayReports();
        });
        
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentPage = 1;
                displayReports();
            }
        });

        loadReports();
    </script>
</body>
</html>
