<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Report | Evidence.gg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 50%, #0a0a1a 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 20px 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #00ffff;
            text-decoration: none;
        }

        .report-card {
            background: rgba(15, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 30px;
            padding: 40px;
        }

        .report-badge {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .report-id {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 20px;
        }

        .amount {
            font-size: 48px;
            font-weight: 800;
            color: #00ff88;
            margin: 20px 0;
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            color: #ff4444;
            margin: 10px 0;
        }

        .user-id {
            font-size: 14px;
            color: #8892b0;
            font-family: monospace;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 25px 0 15px;
            color: #00ffff;
        }

        .description {
            background: rgba(10, 20, 35, 0.5);
            padding: 20px;
            border-radius: 16px;
            line-height: 1.6;
            color: #a0aec0;
        }

        .proof-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 16px;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .proof-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #00ffff;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container" style="text-align: center;">
            <div class="logo">🔷 EVIDENCE.GG 🔷</div>
        </div>
    </div>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Reports</a>
        
        <div id="reportContent" class="report-card">
            <div class="loading">Loading report...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');

        async function loadReport() {
            if (!reportId) {
                document.getElementById('reportContent').innerHTML = '<div class="loading">⚠️ Invalid report ID</div>';
                return;
            }

            try {
                const doc = await db.collection('reports').doc(reportId).get();
                
                if (!doc.exists) {
                    document.getElementById('reportContent').innerHTML = '<div class="loading">⚠️ Report not found</div>';
                    return;
                }

                const data = doc.data();
                
                document.getElementById('reportContent').innerHTML = `
                    <div class="report-badge">🚨 SCAM REPORT 🚨</div>
                    <div class="report-id">Report #${reportId.substring(reportId.length - 6)}</div>
                    <div class="amount">${data.amount || '$0'}</div>
                    <div class="username">${data.username || 'Unknown'}</div>
                    <div class="user-id">Scammer ID: ${data.user_id || 'N/A'}</div>
                    
                    <div class="section-title">📝 REPORT DESCRIPTION</div>
                    <div class="description">${data.summary || 'No description provided.'}</div>
                    
                    ${data.proof_channel ? `
                        <a href="${data.proof_channel}" target="_blank" class="proof-btn">
                            🔍 CHECK PROOFS
                        </a>
                    ` : '<div style="color: #ff4444; text-align: center; margin-top: 20px;">⚠️ No proof channel provided</div>'}
                `;
            } catch (error) {
                document.getElementById('reportContent').innerHTML = `<div class="loading">⚠️ Error: ${error.message}</div>`;
            }
        }

        loadReport();
    </script>
</body>
</html>
