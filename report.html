<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Report | Evidence.gg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 50%, #0a0a1a 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 15px 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 15px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00ffff;
            text-decoration: none;
        }
        .report-card {
            background: rgba(15, 25, 45, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
        }
        .report-badge {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .report-id {
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 15px;
        }
        .amount {
            font-size: 36px;
            font-weight: 800;
            color: #00ff88;
            margin: 15px 0;
        }
        .username {
            font-size: 22px;
            font-weight: 700;
            color: #ff4444;
            margin: 10px 0;
        }
        .user-id {
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 10px;
            color: #00ffff;
        }
        .description {
            background: rgba(10, 20, 35, 0.5);
            padding: 18px;
            border-radius: 12px;
            line-height: 1.5;
            color: #a0aec0;
            font-size: 14px;
        }
        .proof-btn {
            display: block;
            text-align: center;
            padding: 14px;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 25px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #00ffff;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo" style="font-size: 20px;">🔷 EVIDENCE.GG 🔷</div>
    </div>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Reports</a>
        
        <div id="reportContent" class="report-card">
            <div class="loading">Loading report...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkMVWQ4NCqV7yJIUwBwu2NImetw7zUJeY",
            authDomain: "scammer-database.firebaseapp.com",
            projectId: "scammer-database",
            storageBucket: "scammer-database.firebasestorage.app",
            messagingSenderId: "257014278130",
            appId: "1:257014278130:web:1c527b320f36b4d6c5ed6b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');

        async function loadReport() {
            if (!reportId) {
                document.getElementById('reportContent').innerHTML = '<div class="loading">⚠️ Invalid report ID</div>';
                return;
            }

            try {
                const doc = await db.collection('reports').doc(reportId).get();
                
                if (!doc.exists) {
                    document.getElementById('reportContent').innerHTML = '<div class="loading">⚠️ Report not found</div>';
                    return;
                }

                const data = doc.data();
                
                document.getElementById('reportContent').innerHTML = `
                    <div class="report-badge">🚨 SCAM REPORT 🚨</div>
                    <div class="report-id">Report #${reportId.substring(reportId.length - 6)}</div>
                    <div class="amount">${data.amount || '$0'}</div>
                    <div class="username">${escapeHtml(data.username || 'Unknown')}</div>
                    <div class="user-id">Scammer ID: ${escapeHtml(data.user_id || 'N/A')}</div>
                    
                    <div class="section-title">📝 REPORT DESCRIPTION</div>
                    <div class="description">${escapeHtml(data.summary || 'No description provided.')}</div>
                    
                    ${data.proof_channel ? `
                        <a href="${data.proof_channel}" target="_blank" class="proof-btn">
                            🔍 CHECK PROOFS
                        </a>
                    ` : '<div style="color: #ff4444; text-align: center; margin-top: 20px;">⚠️ No proof channel provided</div>'}
                `;
            } catch (error) {
                document.getElementById('reportContent').innerHTML = `<div class="loading">⚠️ Error: ${error.message}</div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        loadReport();
    </script>
</body>
</html>
