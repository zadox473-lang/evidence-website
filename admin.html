<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Evidence.gg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 50%, #0a0a1a 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 15px 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 15px;
        }
        .form-card {
            background: rgba(15, 25, 45, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .form-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #00ffff;
        }
        .form-subtitle {
            color: #8892b0;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #8892b0;
            font-size: 13px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(10, 20, 35, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #00ffff;
        }
        .input-group textarea {
            min-height: 90px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }
        .success {
            background: rgba(0, 255, 128, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        .error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        .generated-link {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
            word-break: break-all;
            font-size: 13px;
        }
        .generated-link a {
            color: #00ffff;
        }
        .logout-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            padding: 6px 14px;
            border-radius: 20px;
            color: #ff4444;
            cursor: pointer;
            font-size: 12px;
        }
        .pending-item {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }
        .pending-item button {
            width: auto;
            padding: 5px 12px;
            margin-right: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="logout-btn" onclick="logout()">🚪 LOGOUT</div>
    
    <div class="header">
        <div class="logo" style="font-size: 20px;">🔷 EVIDENCE.GG | ADMIN PANEL 🔷</div>
    </div>

    <div class="container">
        <div class="form-card">
            <div class="form-title">➕ ADD NEW SCAM REPORT</div>
            <div class="form-subtitle">Fill all details below</div>
            
            <div class="input-group">
                <label>👤 USERNAME (with @)</label>
                <input type="text" id="username" placeholder="@scammer123">
            </div>
            
            <div class="input-group">
                <label>🆔 SCAMMER ID</label>
                <input type="text" id="userId" placeholder="123456789">
            </div>
            
            <div class="input-group">
                <label>💰 AMOUNT</label>
                <input type="text" id="amount" placeholder="$500 or ₹500 or 0.5 BTC">
            </div>
            
            <div class="input-group">
                <label>📝 REPORT DESCRIPTION</label>
                <textarea id="summary" placeholder="What the victim said..."></textarea>
            </div>
            
            <div class="input-group">
                <label>📎 PROOF CHANNEL LINK</label>
                <input type="text" id="proofChannel" placeholder="https://t.me/victim_channel">
            </div>
            
            <button onclick="submitReport()">🚀 SUBMIT REPORT</button>
            
            <div id="message"></div>
            <div id="generatedLink"></div>
        </div>
        
        <div class="form-card">
            <div class="form-title">📋 PENDING REPORTS</div>
            <div id="pendingList">Loading...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkMVWQ4NCqV7yJIUwBwu2NImetw7zUJeY",
            authDomain: "scammer-database.firebaseapp.com",
            projectId: "scammer-database",
            storageBucket: "scammer-database.firebasestorage.app",
            messagingSenderId: "257014278130",
            appId: "1:257014278130:web:1c527b320f36b4d6c5ed6b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                loadPendingReports();
            }
        });

        async function submitReport() {
            const username = document.getElementById('username').value;
            const userId = document.getElementById('userId').value;
            const amount = document.getElementById('amount').value;
            const summary = document.getElementById('summary').value;
            const proofChannel = document.getElementById('proofChannel').value;
            
            if (!username || !userId || !amount || !summary || !proofChannel) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            
            const reportId = Date.now().toString();
            const reportData = {
                id: reportId,
                username: username,
                user_id: userId,
                amount: amount,
                summary: summary,
                proof_channel: proofChannel,
                status: 'approved',
                timestamp: new Date().toISOString()
            };
            
            try {
                await db.collection('reports').doc(reportId).set(reportData);
                
                const link = `https://zadox473-lang.github.io/evidence-website/report.html?id=${reportId}`;
                document.getElementById('generatedLink').innerHTML = `
                    <div class="generated-link">
                        🔗 Report Link: <a href="${link}" target="_blank">evidence.gg/report/${reportId}</a>
                    </div>
                `;
                
                showMessage('Report added successfully!', 'success');
                
                document.getElementById('username').value = '';
                document.getElementById('userId').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('summary').value = '';
                document.getElementById('proofChannel').value = '';
                
                loadPendingReports();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function loadPendingReports() {
            try {
                const snapshot = await db.collection('reports')
                    .where('status', '==', 'pending')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                const container = document.getElementById('pendingList');
                if (snapshot.empty) {
                    container.innerHTML = '<div style="color: #8892b0;">No pending reports</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="pending-item">
                            <div><strong style="color: #ff4444;">${data.username || 'N/A'}</strong> | ID: ${data.user_id || 'N/A'}</div>
                            <div style="font-size: 12px; color: #8892b0;">${data.summary ? data.summary.substring(0, 80) : ''}...</div>
                            <div>
                                <button onclick="approveReport('${doc.id}')" style="width: auto;">✅ Approve</button>
                                <button onclick="rejectReport('${doc.id}')" style="width: auto; background: rgba(255,68,68,0.2);">❌ Reject</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function approveReport(docId) {
            await db.collection('reports').doc(docId).update({ status: 'approved' });
            loadPendingReports();
            showMessage('Report approved!', 'success');
        }
        
        async function rejectReport(docId) {
            await db.collection('reports').doc(docId).update({ status: 'rejected' });
            loadPendingReports();
            showMessage('Report rejected', 'success');
        }
        
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
        }
        
        async function logout() {
            await auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
