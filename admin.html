<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Evidence.gg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 50%, #0a0a1a 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .form-card {
            background: rgba(15, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 30px;
            padding: 40px;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #00ffff;
        }

        .form-subtitle {
            color: #8892b0;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #8892b0;
            font-size: 14px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(10, 20, 35, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .input-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .success {
            background: rgba(0, 255, 128, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
        }

        .generated-link {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 12px;
            word-break: break-all;
        }

        .generated-link a {
            color: #00ffff;
            text-decoration: none;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            padding: 8px 16px;
            border-radius: 20px;
            color: #ff4444;
            cursor: pointer;
            font-size: 12px;
        }

        .pending-count {
            background: #ff4444;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="logout-btn" onclick="logout()">🚪 LOGOUT</div>
    
    <div class="header">
        <div class="container" style="text-align: center;">
            <div class="logo">🔷 EVIDENCE.GG | ADMIN PANEL 🔷</div>
        </div>
    </div>

    <div class="container">
        <div class="form-card">
            <div class="form-title">➕ ADD NEW SCAM REPORT</div>
            <div class="form-subtitle">Fill the details below to add a scammer to the database</div>
            
            <div class="input-group">
                <label>👤 USERNAME (with @)</label>
                <input type="text" id="username" placeholder="@scammer123">
            </div>
            
            <div class="input-group">
                <label>🆔 SCAMMER ID</label>
                <input type="text" id="userId" placeholder="123456789">
            </div>
            
            <div class="input-group">
                <label>💰 AMOUNT (with currency)</label>
                <input type="text" id="amount" placeholder="$500 or ₹500 or 0.5 BTC">
            </div>
            
            <div class="input-group">
                <label>📝 REPORT DESCRIPTION</label>
                <textarea id="summary" placeholder="Write what the victim said..."></textarea>
            </div>
            
            <div class="input-group">
                <label>📎 PROOF CHANNEL LINK</label>
                <input type="text" id="proofChannel" placeholder="https://t.me/victim_proof_channel">
            </div>
            
            <button onclick="submitReport()">🚀 SUBMIT REPORT</button>
            
            <div id="message"></div>
            <div id="generatedLink"></div>
        </div>
        
        <div class="form-card" style="margin-top: 30px;">
            <div class="form-title">📋 PENDING REPORTS</div>
            <div class="form-subtitle">Reports waiting for approval</div>
            <div id="pendingList">Loading...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script>
        // Firebase Config (YAHAN APNI CONFIG PASTE KARO)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Check if user is logged in
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                loadPendingReports();
            }
        });

        async function submitReport() {
            const username = document.getElementById('username').value;
            const userId = document.getElementById('userId').value;
            const amount = document.getElementById('amount').value;
            const summary = document.getElementById('summary').value;
            const proofChannel = document.getElementById('proofChannel').value;
            
            if (!username || !userId || !amount || !summary || !proofChannel) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            
            const reportId = Date.now().toString();
            const reportData = {
                id: reportId,
                username: username,
                user_id: userId,
                amount: amount,
                summary: summary,
                proof_channel: proofChannel,
                status: 'approved',
                timestamp: new Date().toISOString()
            };
            
            try {
                await db.collection('reports').doc(reportId).set(reportData);
                
                const link = `https://evidence.gg/report.html?id=${reportId}`;
                document.getElementById('generatedLink').innerHTML = `
                    <div class="generated-link">
                        🔗 Report Link: <a href="${link}" target="_blank">evidence.gg/report/${reportId}</a><br>
                        <small>Copy this link and send to your bot for channel post</small>
                    </div>
                `;
                
                showMessage('Report added successfully!', 'success');
                
                // Clear form
                document.getElementById('username').value = '';
                document.getElementById('userId').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('summary').value = '';
                document.getElementById('proofChannel').value = '';
                
                loadPendingReports();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function loadPendingReports() {
            try {
                const snapshot = await db.collection('reports')
                    .where('status', '==', 'pending')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                const container = document.getElementById('pendingList');
                if (snapshot.empty) {
                    container.innerHTML = '<div style="color: #8892b0;">No pending reports</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div style="padding: 15px; border-bottom: 1px solid rgba(0,255,255,0.2);">
                            <div><strong style="color: #ff4444;">${data.username || 'N/A'}</strong> | ID: ${data.user_id || 'N/A'}</div>
                            <div style="font-size: 13px; color: #8892b0; margin-top: 5px;">${data.summary ? data.summary.substring(0, 100) : ''}...</div>
                            <div style="margin-top: 10px;">
                                <button onclick="approveReport('${doc.id}')" style="width: auto; padding: 5px 15px; margin-right: 10px;">✅ Approve</button>
                                <button onclick="rejectReport('${doc.id}')" style="width: auto; padding: 5px 15px; background: rgba(255,68,68,0.2);">❌ Reject</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading pending reports:', error);
            }
        }
        
        async function approveReport(docId) {
            await db.collection('reports').doc(docId).update({ status: 'approved' });
            loadPendingReports();
            showMessage('Report approved!', 'success');
        }
        
        async function rejectReport(docId) {
            await db.collection('reports').doc(docId).update({ status: 'rejected' });
            loadPendingReports();
            showMessage('Report rejected', 'success');
        }
        
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
        }
        
        async function logout() {
            await auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
