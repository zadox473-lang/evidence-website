<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Evidence.gg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0c12;
            color: #e2e8f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .form-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .form-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-subtitle {
            font-size: 13px;
            color: #718096;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #a0aec0;
            font-size: 13px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #1f2937;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #4299e1;
        }
        .input-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #4299e1;
            border-radius: 6px;
            color: #4299e1;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: rgba(66, 153, 225, 0.1);
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }
        .success {
            background: rgba(72, 187, 120, 0.1);
            border: 1px solid #48bb78;
            color: #48bb78;
        }
        .error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #dc2626;
        }
        .generated-link {
            margin-top: 15px;
            padding: 12px;
            background: #0d1117;
            border-radius: 6px;
            word-break: break-all;
            font-size: 13px;
        }
        .generated-link a {
            color: #4299e1;
            text-decoration: none;
        }
        .logout-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #111827;
            border: 1px solid #dc2626;
            padding: 6px 14px;
            border-radius: 6px;
            color: #dc2626;
            cursor: pointer;
            font-size: 12px;
        }
        .logout-btn:hover {
            background: rgba(220, 38, 38, 0.1);
        }
    </style>
</head>
<body>
    <div class="logout-btn" onclick="logout()">Logout</div>
    
    <div class="container">
        <div class="header">
            <h1>Admin Panel</h1>
        </div>

        <div class="form-card">
            <div class="form-title">Add New Scam Report</div>
            <div class="form-subtitle">Fill all details below</div>
            
            <div class="input-group">
                <label>Username (with @)</label>
                <input type="text" id="username" placeholder="@scammer123">
            </div>
            
            <div class="input-group">
                <label>Scammer ID</label>
                <input type="text" id="userId" placeholder="123456789">
            </div>
            
            <div class="input-group">
                <label>Amount</label>
                <input type="text" id="amount" placeholder="$500 or ₹500">
            </div>
            
            <div class="input-group">
                <label>Report Description</label>
                <textarea id="summary" placeholder="What the victim said..."></textarea>
            </div>
            
            <div class="input-group">
                <label>Proof Channel Link</label>
                <input type="text" id="proofChannel" placeholder="https://t.me/proof_channel">
            </div>
            
            <button onclick="submitReport()">Submit Report</button>
            
            <div id="message"></div>
            <div id="generatedLink"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkMVWQ4NCqV7yJIUwBwu2NImetw7zUJeY",
            authDomain: "scammer-database.firebaseapp.com",
            projectId: "scammer-database",
            storageBucket: "scammer-database.firebasestorage.app",
            messagingSenderId: "257014278130",
            appId: "1:257014278130:web:1c527b320f36b4d6c5ed6b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        async function submitReport() {
            const username = document.getElementById('username').value;
            const userId = document.getElementById('userId').value;
            const amount = document.getElementById('amount').value;
            const summary = document.getElementById('summary').value;
            const proofChannel = document.getElementById('proofChannel').value;
            
            if (!username || !userId || !amount || !summary || !proofChannel) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            
            const reportId = Date.now().toString();
            const reportData = {
                id: reportId,
                username: username,
                user_id: userId,
                amount: amount,
                summary: summary,
                proof_channel: proofChannel,
                status: 'approved',
                timestamp: new Date().toISOString()
            };
            
            try {
                await db.collection('reports').doc(reportId).set(reportData);
                
                const link = `https://zadox473-lang.github.io/evidence-website/report.html?id=${reportId}`;
                document.getElementById('generatedLink').innerHTML = `
                    <div class="generated-link">
                        Report Link: <a href="${link}" target="_blank">evidence.gg/report/${reportId}</a>
                    </div>
                `;
                
                showMessage('Report added successfully!', 'success');
                
                document.getElementById('username').value = '';
                document.getElementById('userId').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('summary').value = '';
                document.getElementById('proofChannel').value = '';
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
        }
        
        async function logout() {
            await auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
