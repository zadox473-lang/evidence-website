<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <div class="admin-container card">
    <h1>Admin Panel</h1>

    <form id="reportForm">
      <input type="text" id="username" placeholder="@username" required>
      <input type="text" id="user_id" placeholder="Scammer ID" required>
      <input type="text" id="amount" placeholder="$ Amount" required>
      <textarea id="summary" placeholder="Report Description"></textarea>
      <input type="url" id="proof_channel" placeholder="Proof Channel URL">
      <button type="submit">Submit Report</button>
    </form>

    <div id="adminReports"></div>
  </div>
</body>
</html>
